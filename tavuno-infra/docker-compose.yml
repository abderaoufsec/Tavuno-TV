services:

  postgres:
    image: postgres:17.11
    container_name: tavuno-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DISPATCHARR_POSTGRES_PASSWORD: ${DISPATCHARR_POSTGRES_PASSWORD}

    volumes:
      - tavuno_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - tavuno-internal


  redis:
    image: redis:8.0
    container_name: tavuno-redis
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - tavuno_redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - tavuno-internal


  directus:
    image: directus/directus:12.3.1
    container_name: tavuno-directus
    restart: unless-stopped

    ports:
      - "8055:8055"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      SECRET: ${DIRECTUS_SECRET}

      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}

    volumes:
      - tavuno_directus_uploads:/directus/uploads
      - tavuno_directus_extensions:/directus/extensions

    networks:
      - tavuno-internal


  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:0.28.0
    container_name: tavuno-dispatcharr
    restart: unless-stopped

    ports:
      - "9191:9191"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      DISPATCHARR_ENV: modular

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: dispatcharr
      POSTGRES_USER: dispatcharr
      POSTGRES_PASSWORD: ${DISPATCHARR_POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      DISPATCHARR_PORT: 9191

    volumes:
      - tavuno_dispatcharr_data:/data

    networks:
      - tavuno-internal


  dispatcharr-celery:
    image: ghcr.io/dispatcharr/dispatcharr:0.28.0
    container_name: tavuno-dispatcharr-celery
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dispatcharr:
        condition: service_started

    entrypoint:
      - /app/docker/entrypoint.celery.sh

    environment:
      DISPATCHARR_ENV: modular

      DISPATCHARR_PORT: 9191

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: dispatcharr
      POSTGRES_USER: dispatcharr
      POSTGRES_PASSWORD: ${DISPATCHARR_POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    volumes:
      - tavuno_dispatcharr_data:/data

    networks:
      - tavuno-internal


  ovenmediaengine:
    image: ovenmedialabs/ovenmediaengine:v0.21.0
    container_name: tavuno-ovenmediaengine
    restart: unless-stopped

    ports:
      - "1935:1935"
      - "3333:3333"
      - "3478:3478"
      - "8081:8081"
      - "9000:9000"
      - "9999:9999/udp"
      - "10000-10009:10000-10009/udp"

    volumes:
      - ./docker/ome/conf:/opt/ovenmediaengine/bin/origin_conf

    networks:
      - tavuno-internal



  prometheus:
    image: prom/prometheus:v3.8.1
    container_name: tavuno-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - tavuno_prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    networks:
      - tavuno-internal


  grafana:
    image: grafana/grafana:13.2.2
    container_name: tavuno-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      prometheus:
        condition: service_started

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - tavuno_grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro

    networks:
      - tavuno-internal


  caddy:
    image: caddy:2.10.2-alpine
    container_name: tavuno-caddy
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      directus:
        condition: service_started
      tavuno-control:
        condition: service_started

    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tavuno_caddy_data:/data
      - tavuno_caddy_config:/config

    networks:
      - tavuno-public
      - tavuno-internal


  tavuno-control:
    build:
      context: ../tavuno-control
    container_name: tavuno-control
    restart: unless-stopped

    ports:
      - "127.0.0.1:${TAVUNO_API_PORT:-8000}:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dispatcharr:
        condition: service_started

    environment:
      TAVUNO_ENV: ${TAVUNO_ENV:-development}
      TAVUNO_LOG_LEVEL: ${TAVUNO_LOG_LEVEL:-INFO}
      TAVUNO_CATALOG_CACHE_SECONDS: ${TAVUNO_CATALOG_CACHE_SECONDS:-30}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DISPATCHARR_URL: http://dispatcharr:9191
      DISPATCHARR_API_KEY: ${DISPATCHARR_API_KEY:-}
      DISPATCHARR_EXPECTED_VERSION: ${DISPATCHARR_EXPECTED_VERSION:-0.28.0}
      DISPATCHARR_SYNC_INTERVAL_SECONDS: ${DISPATCHARR_SYNC_INTERVAL_SECONDS:-3600}
      DISPATCHARR_TIMEOUT_SECONDS: ${DISPATCHARR_TIMEOUT_SECONDS:-20}
      OME_API_URL: http://tavuno-ovenmediaengine:8081
      OME_API_TOKEN: ${OME_API_TOKEN:-tavuno-m1-local}
      OME_PLAYBACK_BASE_URL: http://localhost:8080/media
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET:-tavuno-playback-secret-key}
      PLAYBACK_TOKEN_TTL_SECONDS: ${PLAYBACK_TOKEN_TTL_SECONDS:-120}

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - tavuno-internal


volumes:

  tavuno_postgres_data:
    name: tavuno_postgres_data

  tavuno_redis_data:
    name: tavuno_redis_data

  tavuno_directus_uploads:
    name: tavuno_directus_uploads

  tavuno_directus_extensions:
    name: tavuno_directus_extensions

  tavuno_dispatcharr_data:
    name: tavuno_dispatcharr_data

  tavuno_prometheus_data:
    name: tavuno_prometheus_data

  tavuno_grafana_data:
    name: tavuno_grafana_data

  tavuno_caddy_data:
    name: tavuno_caddy_data

  tavuno_caddy_config:
    name: tavuno_caddy_config




networks:

  tavuno-internal:
    name: tavuno-internal
    driver: bridge

  tavuno-public:
    name: tavuno-public
    driver: bridge
