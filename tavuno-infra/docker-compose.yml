services:

  postgres:
    image: postgres:17.11
    container_name: tavuno-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DISPATCHARR_POSTGRES_PASSWORD: ${DISPATCHARR_POSTGRES_PASSWORD}

    volumes:
      - tavuno_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - tavuno-internal


  redis:
    image: redis:8.0
    container_name: tavuno-redis
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - tavuno_redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - tavuno-internal


  directus:
    image: directus/directus:12.3.1
    container_name: tavuno-directus
    restart: unless-stopped

    ports:
      - "8055:8055"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      SECRET: ${DIRECTUS_SECRET}

      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}

    volumes:
      - tavuno_directus_uploads:/directus/uploads
      - tavuno_directus_extensions:/directus/extensions

    networks:
      - tavuno-internal


  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:0.28.0
    container_name: tavuno-dispatcharr
    restart: unless-stopped

    ports:
      - "9191:9191"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      DISPATCHARR_ENV: modular

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: dispatcharr
      POSTGRES_USER: dispatcharr
      POSTGRES_PASSWORD: ${DISPATCHARR_POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      DISPATCHARR_PORT: 9191

    volumes:
      - tavuno_dispatcharr_data:/data

    networks:
      - tavuno-internal


  dispatcharr-celery:
    image: ghcr.io/dispatcharr/dispatcharr:0.28.0
    container_name: tavuno-dispatcharr-celery
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dispatcharr:
        condition: service_started

    entrypoint:
      - /app/docker/entrypoint.celery.sh

    environment:
      DISPATCHARR_ENV: modular

      DISPATCHARR_PORT: 9191

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: dispatcharr
      POSTGRES_USER: dispatcharr
      POSTGRES_PASSWORD: ${DISPATCHARR_POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    volumes:
      - tavuno_dispatcharr_data:/data

    networks:
      - tavuno-internal


  ovenmediaengine:
    image: ovenmedialabs/ovenmediaengine:v0.21.0
    container_name: tavuno-ovenmediaengine
    restart: unless-stopped

    ports:
      - "1935:1935"
      - "3333:3333"
      - "3478:3478"
      - "8081:8081"
      - "9000:9000"
      - "9999:9999/udp"
      - "10000-10009:10000-10009/udp"

    environment:
      OME_DVR_MAX_DURATION_SECONDS: ${OME_DVR_MAX_DURATION_SECONDS:-3600}

    volumes:
      - ./docker/ome/conf:/opt/ovenmediaengine/bin/origin_conf
      - tavuno_ome_dvr_storage:/opt/ovenmediaengine/dvr

    networks:
      - tavuno-internal



  prometheus:
    image: prom/prometheus:v3.8.1
    container_name: tavuno-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Mounted separately rather than as the whole directory: the config file
      # is already named in prometheus.yml's rule_files, so this keeps the
      # compose entry next to the file a reviewer will actually open.
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - tavuno_prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    networks:
      - tavuno-internal


  # Engine-level database metrics the application cannot observe about its own
  # connection. Read-only by construction: the exporter only ever issues
  # pg_stat_* style queries.
  #
  # v0.15.0 on purpose, not a newer tag: this deployment's database password
  # contains `#`, which is a fragment delimiter in a URL. v0.15.0 honours
  # DATA_SOURCE_URI/USER/PASS as libpq keyword parameters (no URL parsing), so
  # it authenticates correctly; v0.20.1 rebuilds a DSN string and silently
  # truncates the password, failing auth on every scrape.
  #
  # stat_bgwriter is disabled because PostgreSQL 17 split pg_stat_bgwriter into
  # separate bgwriter/checkpointer views, and this exporter still reads the old
  # one ("column checkpoints_timed does not exist"). The dashboard uses
  # numbackends/transactions, which come from pg_stat_database instead.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0

    command:
      - "--no-collector.stat_bgwriter"
    container_name: tavuno-postgres-exporter
    restart: unless-stopped

    environment:
      # Split into URI/user/pass rather than a single DATA_SOURCE_NAME URL
      # because the password is not URL-safe: a `#` in a URL begins a
      # fragment, so `postgresql://user:pa##word@host` authenticates with a
      # silently truncated password. These three variables are passed to the
      # driver directly and need no escaping.
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - tavuno-internal


  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: tavuno-redis-exporter
    restart: unless-stopped

    environment:
      REDIS_ADDR: "redis://redis:6379"
      # redis.conf requires auth, so the exporter has to authenticate to be
      # able to report anything at all.
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - tavuno-internal


  # Records alerts, groups them and applies inhibition.
  #
  # The default receiver has no integrations on purpose (see
  # config/alertmanager/alertmanager.yml): alerts are visible in the
  # Alertmanager UI and the ALERTS series, but nothing is delivered, because
  # this repository has no SMTP implementation yet and inventing a webhook
  # target would either spam errors or silently discard pages while appearing
  # configured. Adding `webhook_configs` to that receiver is the one edit
  # needed to start delivering.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: tavuno-alertmanager
    restart: unless-stopped

    ports:
      - "127.0.0.1:9093:9093"

    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - tavuno_alertmanager_data:/alertmanager

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

    networks:
      - tavuno-internal


  # Probes dependencies that expose no Prometheus metrics of their own
  # (Dispatcharr, OvenMediaEngine) from the outside, with its own short
  # timeout — so a hung dependency cannot stall the scrape that would report
  # it, which is what happens if the API probes them inline.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: tavuno-blackbox-exporter
    restart: unless-stopped

    volumes:
      - ./config/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"

    networks:
      - tavuno-internal


  grafana:
    image: grafana/grafana:13.2.2
    container_name: tavuno-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      prometheus:
        condition: service_started

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - tavuno_grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON lives outside the provisioning tree so the provider in
      # provisioning/dashboards can watch it and pick up edits without a
      # container restart.
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - tavuno-internal


  caddy:
    image: caddy:2.10.2-alpine
    container_name: tavuno-caddy
    restart: unless-stopped

    ports:
      # HTTP exists only to redirect to HTTPS (M17).
      - "127.0.0.1:8080:80"
      # TLS with Caddy's internal CA; the Caddyfile listens on 443 and
      # redirects the plain-HTTP listener to this port.
      - "127.0.0.1:8443:443"

    depends_on:
      directus:
        condition: service_started
      tavuno-control:
        condition: service_started

    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tavuno_caddy_data:/data
      - tavuno_caddy_config:/config

    networks:
      - tavuno-public
      - tavuno-internal


  tavuno-control:
    build:
      context: ../tavuno-control
    container_name: tavuno-control
    restart: unless-stopped

    ports:
      - "127.0.0.1:${TAVUNO_API_PORT:-8000}:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dispatcharr:
        condition: service_started

    environment:
      TAVUNO_ENV: ${TAVUNO_ENV:-development}
      TAVUNO_LOG_LEVEL: ${TAVUNO_LOG_LEVEL:-INFO}
      TAVUNO_CATALOG_CACHE_SECONDS: ${TAVUNO_CATALOG_CACHE_SECONDS:-30}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DISPATCHARR_URL: http://dispatcharr:9191
      DISPATCHARR_API_KEY: ${DISPATCHARR_API_KEY:-}
      DISPATCHARR_EXPECTED_VERSION: ${DISPATCHARR_EXPECTED_VERSION:-0.28.0}
      DISPATCHARR_SYNC_INTERVAL_SECONDS: ${DISPATCHARR_SYNC_INTERVAL_SECONDS:-3600}
      DISPATCHARR_TIMEOUT_SECONDS: ${DISPATCHARR_TIMEOUT_SECONDS:-20}
      # Public Directus origin, used to turn stored file UUIDs into fetchable
      # /assets/<uuid> URLs (A6). This is the address *clients* can reach, so it
      # is the emulator's host alias locally and the real origin in production.
      DIRECTUS_PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-}
      OME_API_URL: http://tavuno-ovenmediaengine:8081
      OME_API_TOKEN: ${OME_API_TOKEN:-tavuno-m1-local}
      OME_PLAYBACK_BASE_URL: ${OME_PLAYBACK_BASE_URL:-http://localhost:8080/media}
      PLAYBACK_PUBLIC_HOST: ${PLAYBACK_PUBLIC_HOST:-}
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET:-tavuno-playback-secret-key}
      PLAYBACK_TOKEN_TTL_SECONDS: ${PLAYBACK_TOKEN_TTL_SECONDS:-120}
      JWT_SECRET: ${JWT_SECRET:-tavuno-jwt-secret-key-change-in-production}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      PASSWORD_HASH_SCHEME: ${PASSWORD_HASH_SCHEME:-bcrypt}
      # Free launch: no login required. Seeded guest identity is used for
      # catalog/playback. Set AUTH_OPEN_ACCESS=false to re-enable auth.
      AUTH_OPEN_ACCESS: ${AUTH_OPEN_ACCESS:-true}
      AUTH_GUEST_EMAIL: ${AUTH_GUEST_EMAIL:-guest@tavuno.local}
      AUTH_GUEST_DEVICE_KEY: ${AUTH_GUEST_DEVICE_KEY:-tavuno-tv-guest}
      # Live-channel test scope: restrict /v1/channels and /v1/home to a small
      # set of verified-working channels while testing. An empty allowlist plus
      # limit 0 exposes the full synced catalog (production).
      TAVUNO_LIVE_CHANNEL_ALLOWLIST: ${TAVUNO_LIVE_CHANNEL_ALLOWLIST:-}
      TAVUNO_LIVE_CHANNEL_LIMIT: ${TAVUNO_LIVE_CHANNEL_LIMIT:-0}
      # Apply the SQL files in tavuno-control/migrations at startup, recording each
      # one in the tavuno_schema_migrations ledger. On by default for this dev stack
      # so an already-initialized clone reaches a working schema with no manual
      # step; every migration guards itself, so replaying one against an existing
      # database is a no-op. This does not bootstrap a database from nothing: the
      # migrations patch the Directus base schema created by
      # tavuno-infra/scripts/apply-m2-schema.ps1, and fail where that has never
      # run. Set TAVUNO_AUTO_MIGRATE=false to manage the schema by hand.
      TAVUNO_AUTO_MIGRATE: ${TAVUNO_AUTO_MIGRATE:-true}
      # Shared secret for the read-only ops dashboard (GET /v1/ops). Guarded by
      # a token rather than require_admin because free-launch mode gives the
      # guest role `user`, which would make every admin route 403. Override in
      # production.
      TAVUNO_OPS_TOKEN: ${TAVUNO_OPS_TOKEN:-tavuno-ops-local}

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - tavuno-internal


volumes:

  tavuno_postgres_data:
    name: tavuno_postgres_data

  tavuno_redis_data:
    name: tavuno_redis_data

  tavuno_directus_uploads:
    name: tavuno_directus_uploads

  tavuno_directus_extensions:
    name: tavuno_directus_extensions

  tavuno_dispatcharr_data:
    name: tavuno_dispatcharr_data

  tavuno_prometheus_data:
    name: tavuno_prometheus_data

  tavuno_alertmanager_data:
    name: tavuno_alertmanager_data

  tavuno_grafana_data:
    name: tavuno_grafana_data

  tavuno_caddy_data:
    name: tavuno_caddy_data

  tavuno_caddy_config:
    name: tavuno_caddy_config

  tavuno_ome_dvr_storage:
    name: tavuno_ome_dvr_storage




networks:

  tavuno-internal:
    name: tavuno-internal
    driver: bridge

  tavuno-public:
    name: tavuno-public
    driver: bridge
