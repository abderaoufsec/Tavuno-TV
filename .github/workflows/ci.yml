name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Weekly instrumented run - the emulator job is too expensive to run on
    # every push, so it is scheduled and also available on demand.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tavuno-control/requirements.txt

      - name: Install backend dependencies
        working-directory: tavuno-control
        run: pip install -r requirements.txt

      - name: Provision .env from .env.example
        working-directory: tavuno-infra
        run: |
          set -euo pipefail
          cp .env.example .env

          # F-2: compose requires these with no fallback (they are interpolated
          # with ${VAR:?...}), so a fresh checkout has to generate them or the
          # very first `docker compose up` aborts with an unset-variable error.
          for key in \
              JWT_SECRET PLAYBACK_TOKEN_SECRET TAVUNO_OPS_TOKEN OME_API_TOKEN \
              AUTH_GUEST_DEVICE_KEY POSTGRES_PASSWORD REDIS_PASSWORD \
              DIRECTUS_SECRET DIRECTUS_ADMIN_PASSWORD \
              DISPATCHARR_POSTGRES_PASSWORD DISPATCHARR_API_KEY \
              GRAFANA_ADMIN_PASSWORD; do
            value="$(openssl rand -hex 24)"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              printf '%s=%s\n' "$key" "$value" >> .env
            fi
          done

          # Nothing guessable may survive from the template.
          if grep -q "CHANGE_ME" .env; then
            echo "::error::CHANGE_ME placeholders remain in .env"
            grep -n "CHANGE_ME" .env
            exit 1
          fi
          echo ".env provisioned"

      - name: Start the stack
        working-directory: tavuno-infra
        run: docker compose up -d --build

      - name: Bootstrap the Directus base schema
        run: |
          set -uo pipefail
          # The 16 Tavuno collections (tavuno_profiles, tavuno_devices,
          # tavuno_channels, ...) are created by Directus, NOT by
          # tavuno-control/migrations - see docs/M2_Data_Foundation.md,
          # "Reproducibility". On a fresh database the API therefore
          # crash-loops with `relation "tavuno_profiles" does not exist`
          # until this idempotent script has run once.
          echo "Waiting for Directus..."
          healthy=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8055/server/health > /dev/null 2>&1; then
              echo "Directus healthy after ${attempt} attempt(s)"
              healthy=1
              break
            fi
            sleep 5
          done
          if [ "$healthy" -ne 1 ]; then
            echo "::error::Directus never became healthy"
            docker compose -f tavuno-infra/docker-compose.yml logs --tail 200
            exit 1
          fi

          pwsh tavuno-infra/scripts/apply-m2-schema.ps1
          echo "Base schema applied"

          # tavuno-control gave up while the collections were missing.
          # `restart: unless-stopped` keeps retrying, but restart explicitly so
          # the migrations run against a schema that now exists.
          docker compose -f tavuno-infra/docker-compose.yml restart tavuno-control

      - name: Wait for the API
        run: |
          set -uo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "API healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::API never became healthy"
          docker compose -f tavuno-infra/docker-compose.yml logs --tail 300
          exit 1

      - name: Run the backend suite
        working-directory: tavuno-control
        run: python -m pytest tests -q

      - name: Stack logs
        if: failure()
        run: docker compose -f tavuno-infra/docker-compose.yml logs --tail 300

      - name: Tear down
        if: always()
        run: docker compose -f tavuno-infra/docker-compose.yml down -v

  android:
    name: Android (unit tests + debug build)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Unit tests and debug build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tavuno-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: android/app/build/test-results/**/*.xml
          if-no-files-found: ignore

  android-instrumented:
    name: Android instrumented (emulator)
    # Scheduled/manual only - it boots an emulator, so it is not on the
    # per-push critical path.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-results
          path: android/app/build/outputs/androidTest-results/**/*.xml
          if-no-files-found: ignore
